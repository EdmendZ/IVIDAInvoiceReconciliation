[project]
name = "ivida-invoice-reconciliation"
version = "0.1.0"
description = "Invoice and Receive Note extraction and reconciliation prototype for IVIDA"
requires-python = ">=3.11,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=25,<26",
    "fastapi>=0.115,<1",
    "minio>=7.2,<8",
    "mineru-open-sdk>=0.2.5,<0.3",
    "openai>=1.100,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pdfplumber>=0.11,<1",
    "pypdf>=5,<7",
    "pytest>=8.3,<10",
    "reportlab>=4.2,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
