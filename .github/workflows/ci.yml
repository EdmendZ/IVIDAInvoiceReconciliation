name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      harness_task:
        description: "Explicit current task ID; leave empty for ordinary branch CI"
        type: string
        required: false
        default: ""
      harness_base:
        description: "Accepted task base commit"
        type: string
        required: false
        default: ""
      harness_freeze:
        description: "Coordinator trusted freeze JSON (never a candidate report)"
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      harness_task:
        description: "Explicit current task ID; leave empty for ordinary branch CI"
        type: string
        required: false
        default: ""
      harness_base:
        description: "Accepted task base commit"
        type: string
        required: false
        default: ""
      harness_freeze:
        description: "Coordinator trusted freeze JSON (never a candidate report)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  UV_VERSION: "0.11.26"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run python -m compileall -q app tests tools
      - name: Validate frozen Spec references
        run: uv run python tools/check_spec_contract.py --spec-root spec
      - name: Validate explicitly declared task scope
        env:
          HARNESS_TASK: ${{ inputs.harness_task }}
          HARNESS_BASE: ${{ inputs.harness_base }}
          HARNESS_FREEZE: ${{ inputs.harness_freeze }}
        shell: bash
        run: |
          if [[ -z "$HARNESS_TASK$HARNESS_BASE$HARNESS_FREEZE" ]]; then
            echo "Ordinary CI: no task scope declared; static Spec and guard tests still run."
            exit 0
          fi
          if [[ -z "$HARNESS_TASK" || -z "$HARNESS_BASE" || -z "$HARNESS_FREEZE" ]]; then
            echo "All three task scope inputs are required together."
            exit 1
          fi
          evidence="$RUNNER_TEMP/ir-harness-freeze.json"
          printf '%s' "$HARNESS_FREEZE" > "$evidence"
          uv run python tools/check_task_scope.py --task "$HARNESS_TASK" --base "$HARNESS_BASE" --spec-root spec --evidence "$evidence"
      - name: Resolve comparison base
        id: base
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base="HEAD~1"; fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - run: uv run python tools/check_documentation_sync.py --base-ref "${{ steps.base.outputs.sha }}"
      - run: git diff --check "${{ steps.base.outputs.sha }}"...HEAD

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run pytest --ignore=tests/test_postgres_reconciliation_case_integration.py --junitxml=backend-junit.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-junit
          path: backend-junit.xml
          retention-days: 7

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ivida_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ir_simple_ci_workspace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ivida_ci -d ir_simple_ci_workspace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://ivida_ci:ci-only-password@127.0.0.1:5432/ir_simple_ci_workspace_test
      IVIDA_TEST_POSTGRES_URL: postgresql+psycopg://ivida_ci:ci-only-password@127.0.0.1:5432/ir_simple_ci_workspace_test
      WORKSPACE_TEST_DATABASE_URL: postgresql+psycopg://ivida_ci:ci-only-password@127.0.0.1:5432/ir_simple_ci_workspace_test
      APP_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run alembic upgrade head
      - run: uv run pytest tests/test_postgres_reconciliation_case_integration.py --junitxml=postgres-junit.xml
      - run: uv run pytest tests/test_postgres_workspace_repository.py tests/test_workspace_acceptance.py --junitxml=workspace-junit.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: postgres-junit
          path: postgres-junit.xml
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: workspace-junit
          path: workspace-junit.xml
          retention-days: 7
      - run: uv run alembic downgrade -1
      - run: uv run alembic upgrade head
      - run: uv run alembic current
      - run: uv run alembic heads
      - run: uv run alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run typecheck
      - run: npm run build
